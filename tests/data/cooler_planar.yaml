# A freestanding cooler: no silicon layer, which is legal for an optics-only
# stack. Guards the reporting path that used to demand one.
run:
  optics: true
  thermal: false
  plots: false
  write_outputs: false

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 899}
  angles: normal
  polarization: unpolarized
  s4_modes: 1

geometry:
  source: s4
  shape: flat
  photonic_material: sio2
  lattice: {type: square, x: 7.0, y: 7.0}

structure:
  - {material: sio2, thickness: 500.0}
  - {material: vacuum, thickness: 0.0, terminal: true}

materials:
  sio2: PalikKitamura_SiO2
