# Full run: optics (RCWA via S4) + thermal energy balance + cell, coupled in
# memory. Mirrors the MATLAB default (a SiO2 cylinder array on a Si3N4/Si/Ag
# stack). The compiled S4 solve at this resolution is expensive; it is a
# schema fixture here, not something the tests solve.

optics:
  wavelength: {min: 0.3, max: 30.0, n: 2000}
  angles: hemispherical     # normal | hemispherical
  polarization: unpolarized # TE | TM | unpolarized
  hemisphere_theta_points: 8
  hemisphere_azimuth_points: 12
  s4_modes: 100             # S4 Fourier truncation (NumBasis); patterned layers need ~100+
  geometry:
    shape: cylinder         # flat | sphere | semisphere | triangle | cylinder | grating
    photonic_material: sio2
    lattice: {type: square, x: 20.0, y: 20.0}
    cylinder: {radius: 5.0, height: 30.0}
  structure:                # ordered layers below the photonic structure
    - {material: sio2,      thickness: 100.0}
    - {material: si3n4,     thickness: 0.075}
    - {material: silicon,   thickness: 250.0}
  substrate: substrate      # the semi-infinite layer below the stack
  materials:                # logical name -> registry model
    sio2: PalikKitamura_SiO2
    silicon: SiliconNew
    si3n4: DrudeSi3N4
    substrate: Hagemann_Ag

thermal:
  ambient_temperature: 298       # K
  convection_coefficient: 12     # W/m2-K

cell:
  series_resistance: 0.00011     # Ohm m2
  shunt_resistance: 0.1          # Ohm m2
  bandgap: {eg0: 1.166, alpha: 4.73e-4, beta: 636}
  voltage: {min: 0.1, max: 0.8, n: 100}
