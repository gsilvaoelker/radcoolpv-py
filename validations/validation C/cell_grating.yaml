# Validation C -- Zhao et al., Renewable Energy 191 (2022) 662-668.
# 200 um Si cell with the 500 um silica micro-grating cooler on top (p=7, w=1.4, d=10 um). Strong mid-IR emissivity from the grating-enhanced silica.
#
# Optics computed by build_optics_s4.py with the S4 RCWA engine (the grating via
# radcoolpv's  shape). Solar band fixed to the paper's cell absorptivity
# alpha~0.95; the mid-IR emissivity is the S4 result. Read here via optics: false.

run:
  optics: false
  thermal: true
  plots: false
  mode: cooling_curve
  results_dir: results/grating
  outputs: [clean]
  optics_results: data/optics/cell_grating.txt

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 900}
  angles: hemispherical

thermal:
  ambient_temperature: 300        # K (paper)
  convection_coefficient: 6        # W/m2-K (paper Fig. 3 baseline)
  solar_irradiance: 800            # W/m2 (paper Fig. 3)
  cooling_temperature: {min: 300.0, max: 500.0, n: 2001}
  equilibrium: auto

data:
  solar_spectrum: data/astmg173.xlsx      # resolves to bundled AM1.5G
  atmosphere: data/cptrans_nq_100_15.dat  # resolves to bundled Cerro Pachon
