# Validation A.1, FULL RUN: hemispherical live S4 optics + thermal + PV, in one
# process. This is the expensive, server-grade version of A.1. Budget hours.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE SPENDING THE COMPUTE
#
# The paper states the soda-lime hemisphere diameter, flat-layer thickness, and
# periodic cell for this row. This file is the expensive one-process version
# for a full hemispherical optics + thermal + PV comparison.
# ---------------------------------------------------------------------------
#
# WHY ONE PROCESS AND NOT THE TWO-STEP CHAIN
#
# A.1's cheap path exports a spectrum and resumes it. Do NOT do that here.
# `write_optics_export` writes five columns (lambda, R, T, emit, abs_si), which
# drops both the normal-incidence columns and the angle-resolved atmospheric
# term. Resuming such a file makes the thermal stage fall back to
# emit_atm = 1 - atm and the product-of-averages form emit_atm * emit, whereas
# the correct hemispherical term is the angular average of the PRODUCT,
# <emit * emit_atm>. Running optics and thermal together keeps the in-memory
# OpticsResult, which carries the correct term. That is the entire reason
# run.optics and run.thermal are both true below.
#
# Live S4 with run.thermal also *requires* angles: hemispherical (config.py
# rejects anything else), so this is the only shape a full run can take.
#
# Run (see validations/run_full_validation.py for a server-friendly driver):
#   radcoolpv run "validations/validation A.1/full_hemisph_sodalime.yaml"

run:
  optics: true
  thermal: true
  plots: true
  write_outputs: true
  results_dir: results/full_hemisph
  mode: standard

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 2000}
  angles: hemispherical
  polarization: unpolarized
  # 1 + 8*12 = 97 directions x 2 polarizations = 194 S4 solves per wavelength.
  hemisphere_theta_points: 8
  hemisphere_azimuth_points: 12
  # The cooling bands converge by ~30 (see validation A.2's convergence table).
  # The solar band does not converge at any affordable setting for a 9 um pitch.
  s4_modes: 30

geometry:
  source: s4
  shape: semisphere
  photonic_material: sodalime
  lattice: {type: hexagonal, x: 17.3205, y: 10.0}   # paper: periodic cell (17.3, 10) um
  sphere: {radius: 4.5}          # 9 um diameter
  discretization_layers: 12

structure:
  - {material: sodalime, thickness: 75.0}
  - {material: si3n4,    thickness: 0.075}
  - {material: silicon,  thickness: 250.0}
  - {material: ag,       thickness: 0.0, terminal: true}

materials:
  sodalime: Rubin_SodaLime
  si3n4: DrudeSi3N4
  silicon: SiliconNew
  ag: Hagemann_Ag

thermal:
  ambient_temperature: 298       # K
  convection_coefficient: 12     # W/m2-K
  voltage: {min: 0.1, max: 0.8, n: 100}
  equilibrium: auto
  pv:
    series_resistance: 0.00011   # Ohm m2 (= 1.1 Ohm cm2)
    shunt_resistance: 0.1        # Ohm m2 (= 1000 Ohm cm2)
    bandgap: {eg0: 1.166, alpha: 4.73e-4, beta: 636}
    iqe_file: data/siliconIQE.txt   # resolves to radcoolpv's default

data:
  solar_spectrum: data/astmg173.xlsx           # resolves to radcoolpv's default (AM1.5G)
  atmosphere: data/atmosphericData/cptrans_nq_100_15.dat
