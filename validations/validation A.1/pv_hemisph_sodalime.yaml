# Validation A.1, step 2 of 2: PV and thermal from the step-1 spectrum.
#
# NOT a literature validation. Together with step 1 this checks that a
# hexagonal-cell YAML solves in S4 and that the resulting optics drive the PV
# stage end to end. The assumed close-packed pitch means these numbers are not
# a reproduction of the Opt. Express Table 1 row.
#
# The spectrum resumed here is TE at normal incidence. optics_results_angles is
# therefore `normal`, which is an explicit angle-independent approximation for
# the radiative terms, not a hemispherical calculation. A live S4 thermal run
# would instead require simulation.angles: hemispherical.
#
# Thermal and PV parameters are copied from Validation A's soda-lime row so the
# electrical model is exercised with realistic silicon-cell values.
#
# Run:  radcoolpv run "validations/validation A.1/pv_hemisph_sodalime.yaml"

run:
  optics: false
  thermal: true
  plots: false
  mode: standard
  results_dir: results
  write_outputs: true
  optics_results: data/optics/hemisph_sodalime_te_normal.txt
  optics_results_angles: normal      # angle-independent approximation

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 2000}
  angles: normal

structure:                            # thermal stage needs the Si thickness
  - {material: silicon,   thickness: 250.0}
  - {material: substrate, thickness: 0.0, terminal: true}

thermal:
  ambient_temperature: 298       # K
  convection_coefficient: 12     # W/m2-K
  voltage: {min: 0.1, max: 0.8, n: 100}
  equilibrium: auto
  pv:
    series_resistance: 0.00011   # Ohm m2 (= 1.1 Ohm cm2)
    shunt_resistance: 0.1        # Ohm m2 (= 1000 Ohm cm2)
    bandgap: {eg0: 1.166, alpha: 4.73e-4, beta: 636}
    iqe_file: data/siliconIQE.txt   # resolves to radcoolpv's default

data:
  solar_spectrum: data/astmg173.xlsx           # resolves to radcoolpv's default (AM1.5G)
  atmosphere: data/atmosphericData/cptrans_nq_100_15.dat
