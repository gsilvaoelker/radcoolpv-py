# Validation A.1, step 1 of 2: live S4 optics for the "Hemisph. soda-lime"
# row of Table 1.
#
# The Opt. Express paper states that the best soda-lime design uses 9 um
# hemispheres on a 75 um soda-lime layer. In the same paragraph it gives the
# hexagonal periodic cell as (17.3, 10) um. That makes this a live-optics
# literature comparison.
#
# radcoolpv's hexagonal cell is the centred-rectangular supercell:
#   x ~= sqrt(3) * pitch = 17.3205,  y = pitch = 10.0
# and radcoolpv adds the second motif at (x/2, y/2) automatically. That second
# motif is needed to match the paper's periodic cell.
#
# Normal incidence, on purpose. The bundled Fig. 3(b) reference spectrum is the
# seven-column PVcode form with normal-incidence columns alongside the
# hemispherical ones. Comparing normal against normal is like-for-like and far
# cheaper than a full hemispherical thermal run.
#
# Run:  radcoolpv run "validations/validation A.1/optics_hemisph_sodalime.yaml"

run:
  optics: true
  thermal: false
  plots: false
  write_outputs: false
  # Fixed path in the five-column form step 2 reads back, so the two runs chain
  # directly. The timestamped results folder cannot serve this purpose.
  optics_export: data/optics/hemisph_sodalime_normal.txt

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 2000}   # same grid as Validation A
  angles: normal
  polarization: unpolarized
  s4_modes: 30

geometry:
  source: s4
  shape: semisphere
  photonic_material: sodalime
  lattice: {type: hexagonal, x: 17.3205, y: 10.0}   # paper: periodic cell (17.3, 10) um
  sphere: {radius: 4.5}       # 9 um diameter
  discretization_layers: 12   # slices through the dome; see validations/README.md

structure:                    # flat layers below the hemispheres
  - {material: sodalime, thickness: 75.0}
  - {material: si3n4,    thickness: 0.075}
  - {material: silicon,  thickness: 250.0}
  - {material: ag,       thickness: 0.0, terminal: true}

materials:
  sodalime: Rubin_SodaLime
  si3n4: DrudeSi3N4
  silicon: SiliconNew
  ag: Hagemann_Ag
