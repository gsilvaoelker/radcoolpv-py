# Validation A.2: live S4 optics for the "Hemisph. PDMS" row of Table 1.
#
# Unlike A.1, this case uses the paper's OWN stated geometry, so a disagreement
# here is attributable to the code rather than to an assumed parameter. The
# Opt. Express paper states, for the PDMS all-photonic design:
#
#   "hemispheres of 8 um diameter and a layer of 75 um, also compared to its
#    flat counterpart of 79 um -- both in a periodic cell of (17.3, 10) um."
#
# The cell (17.3, 10) is the centred-rectangular supercell of a hexagonal
# lattice of pitch 10 um, since sqrt(3) * 10 = 17.3205. radcoolpv adds the
# second motif at (x/2, y/2) automatically. Note that pitch (10 um) exceeds the
# hemisphere diameter (8 um): the domes are separated, NOT close-packed. This
# is the detail that A.1's soda-lime case had to guess, and guessed differently.
#
# Normal incidence, on purpose. The bundled reference spectrum
# (validation A/data/Fig. 3C blue/opticalProps-PVcode.txt) is the seven-column
# PVcode form, which carries normal-incidence columns alongside the
# hemispherical ones. Comparing normal against normal is like-for-like with no
# angular approximation anywhere, and it costs one S4 solve per wavelength
# instead of 194 -- about 2.5 minutes instead of about a day. See the README
# for the hemispherical recipe, which is what a thermal comparison would need.
#
# Run:  radcoolpv run "validations/validation A.2/optics_pdms_hemisph.yaml"
# Or, with the automatic comparison against the published spectrum:
#       PYTHONPATH=. python "validations/validation A.2/run_pdms_optics_validation.py"

run:
  optics: true
  thermal: false
  plots: false
  write_outputs: false
  # Fixed path in the five-column resume form, so a thermal stage can chain
  # off this run without going through a timestamped results folder.
  optics_export: data/optics/pdms_hemisph_normal.txt

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 2000}   # same grid as Validation A
  angles: normal
  polarization: unpolarized
  # Converges the 8-30 um cooling bands in about 2.5 minutes. Raise to 45-60 to
  # tighten the broadband figure. The SOLAR band is not converged at any of the
  # mode counts in the README's convergence table, and cannot be cheaply: at
  # 0.3 um the 10 um pitch is over thirty wavelengths wide.
  s4_modes: 30

geometry:
  source: s4
  shape: semisphere
  photonic_material: pdms
  lattice: {type: hexagonal, x: 17.3205, y: 10.0}   # paper: periodic cell (17.3, 10) um
  sphere: {radius: 4.0}                              # 8 um diameter
  discretization_layers: 12   # slices through the dome; see the README

structure:                    # flat layers below the hemispheres
  - {material: pdms,    thickness: 75.0}
  - {material: si3n4,   thickness: 0.075}   # 75 nm anti-reflection coating
  - {material: silicon, thickness: 250.0}
  - {material: ag,      thickness: 0.0, terminal: true}

materials:
  pdms: GuptaQuerry_PDMS
  si3n4: DrudeSi3N4
  silicon: SiliconNew
  ag: Hagemann_Ag
