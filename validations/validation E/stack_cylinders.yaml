# Validation E -- Akerboom et al., ACS Photonics 2022, 9, 3831-3840.
# Microcylinder module glass (Fig. 5, Au-Si-SiO2-cylinders): hexagonal silica cylinders r=1.75 height=2.25 pitch=6.125 um etched into the glass. Paper: 336 K, 97.7% emissivity.
#
# Optics computed by build_optics_s4.py with the S4 RCWA engine (normal
# incidence, matching the paper's Fig. 5a emissivity) and read via optics: false.

run:
  optics: false
  thermal: true
  plots: false
  mode: cooling_curve
  results_dir: results/cylinders
  outputs: [clean]
  optics_results: data/optics/s4_au_si_sio2_cylinders.txt

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 3000}
  angles: hemispherical

thermal:
  ambient_temperature: 300       # K
  convection_coefficient: 12      # W/m2-K effective (Methods states 6; see README)
  cooling_temperature: {min: 300.0, max: 460.0, n: 1601}
  equilibrium: auto

data:
  solar_spectrum: data/astmg173.xlsx
  atmosphere: data/cptrans_nq_100_15.dat
