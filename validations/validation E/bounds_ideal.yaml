# Validation E -- Akerboom et al., ACS Photonics 2022, 9, 3831-3840.
# Theoretical lower bound (Fig. 2c/2d, blue curve): the ideal silicon solar
# absorber -- unity emissivity across the full 3-30 um blackbody band, zero
# between the bandgap and 3 um. This minimizes the equilibrium temperature; the
# paper reports 330.5 K.
#
# Optical file built by build_optics.py (emit = 1 for lambda <= 1.107 um and in
# 3-30 um; 0 in 1.107-3 um).

run:
  optics: false
  thermal: true
  plots: false
  mode: cooling_curve
  results_dir: results/bound_ideal
  outputs: [clean]
  optics_results: data/optics/bound_ideal.txt

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 3000}
  angles: hemispherical

thermal:
  ambient_temperature: 300       # K
  convection_coefficient: 12      # W/m2-K effective (Methods states 6; see README)
  cooling_temperature: {min: 300.0, max: 460.0, n: 1601}
  equilibrium: auto

data:
  solar_spectrum: data/astmg173.xlsx
  atmosphere: data/cptrans_nq_100_15.dat
