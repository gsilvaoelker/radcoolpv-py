# Akerboom et al., ACS Photonics 9 (2022) 3831-3840.
# One command runs all calculated-optics and measured-emittance thermal cases:
#   radcoolpv run "validations/validation E/validation.yaml"

definitions:
  optical_run: &optical_run
    optics: true
    thermal: false
    plots: true
    mode: standard
    write_outputs: true

  normal_s4: &normal_s4
    wavelength: {min: 2.0, max: 16.0, n: 281}
    angles: normal
    polarization: unpolarized
    s4_modes: 60

  paper_materials: &paper_materials
    sio2: PalikKitamura_SiO2
    silicon: Akerboom_Si_lossless
    gold: RII_Olmon_2012_ev_Au

  bare_structure: &bare_structure
    - {material: silicon, thickness: 500.0}
    - {material: gold, thickness: 0.08}
    - {material: vacuum, thickness: 0.0, terminal: true}

  covered_structure: &covered_structure
    - {material: sio2, thickness: 500.0}
    - {material: silicon, thickness: 500.0}
    - {material: gold, thickness: 0.08}
    - {material: vacuum, thickness: 0.0, terminal: true}

  thermal_run: &thermal_run
    optics: false
    thermal: true
    plots: true
    mode: cooling_curve
    write_outputs: true
    optics_results: data/digitized/fig5a_measured_emittance.txt
    optics_results_angles: hemispherical

  thermal_simulation: &thermal_simulation
    wavelength: {min: 2.0, max: 16.0, n: 281}
    angles: hemispherical

  thermal_inputs: &thermal_inputs
    ambient_temperature: 300.0
    absorbed_solar_power: 808.0
    equilibrium: auto
    reference_curve_file: data/digitized/fig5b_cooling_power.txt

  paper_stated_thermal: &paper_stated_thermal
    <<: *thermal_inputs
    # Paper Methods value. These cases intentionally expose its disagreement
    # with the paper's own Figure 5b temperatures.
    convection_coefficient: 6.0
    cooling_temperature: {min: 260.0, max: 440.0, n: 181}

  calibrated_thermal: &calibrated_thermal
    <<: *thermal_inputs
    # Effective total coefficient inferred by one least-squares fit to all
    # three digitized Figure 5b curves; not an independent convection result.
    convection_coefficient: 12.54
    cooling_temperature: {min: 260.0, max: 380.0, n: 121}

  paper_data: &paper_data
    solar_spectrum: data/astmg173.xlsx
    atmosphere: data/cptrans_nq_100_15.dat

cases:
  - name: optics_bare
    run:
      <<: *optical_run
      results_dir: results/optics_bare
    simulation: *normal_s4
    geometry:
      source: s4
      shape: flat
      photonic_material: vacuum
      lattice: {type: hexagonal, x: 10.608811, y: 6.125}
    structure: *bare_structure
    materials: *paper_materials
    comparison:
      spectra:
        - {label: Paper Fig. 3a, file: data/digitized/fig3a_calculated_emittance.txt, column: 1, color: '#008000'}
    data: *paper_data

  - name: optics_flat_silica
    run:
      <<: *optical_run
      results_dir: results/optics_flat_silica
    simulation: *normal_s4
    geometry:
      source: s4
      shape: flat
      photonic_material: sio2
      lattice: {type: hexagonal, x: 10.608811, y: 6.125}
    structure: *covered_structure
    materials: *paper_materials
    comparison:
      spectra:
        - {label: Paper Fig. 3a, file: data/digitized/fig3a_calculated_emittance.txt, column: 2, color: '#ff0000'}
    data: *paper_data

  - name: optics_silica_cylinders
    run:
      <<: *optical_run
      results_dir: results/optics_silica_cylinders
    simulation: *normal_s4
    geometry:
      source: s4
      shape: cylinder
      photonic_material: sio2
      lattice: {type: hexagonal, x: 10.608811, y: 6.125}
      cylinder: {radius: 1.75, height: 2.25}
    structure: *covered_structure
    materials: *paper_materials
    comparison:
      spectra:
        - {label: Paper Fig. 3a, file: data/digitized/fig3a_calculated_emittance.txt, column: 3, color: '#0000ff'}
    data: *paper_data

  - name: cooling_paper_h6_bare
    run:
      <<: *thermal_run
      results_dir: results/cooling_paper_h6_bare
      optics_results_emittance_column: 1
    simulation: *thermal_simulation
    thermal:
      <<: *paper_stated_thermal
      reference_curve_column: 1
    data: *paper_data

  - name: cooling_paper_h6_flat_silica
    run:
      <<: *thermal_run
      results_dir: results/cooling_paper_h6_flat_silica
      optics_results_emittance_column: 2
    simulation: *thermal_simulation
    thermal:
      <<: *paper_stated_thermal
      reference_curve_column: 2
    data: *paper_data

  - name: cooling_paper_h6_silica_cylinders
    run:
      <<: *thermal_run
      results_dir: results/cooling_paper_h6_silica_cylinders
      optics_results_emittance_column: 3
    simulation: *thermal_simulation
    thermal:
      <<: *paper_stated_thermal
      reference_curve_column: 3
    data: *paper_data

  - name: cooling_calibrated_bare
    run:
      <<: *thermal_run
      results_dir: results/cooling_calibrated_bare
      optics_results_emittance_column: 1
    simulation: *thermal_simulation
    thermal:
      <<: *calibrated_thermal
      reference_curve_column: 1
    data: *paper_data

  - name: cooling_calibrated_flat_silica
    run:
      <<: *thermal_run
      results_dir: results/cooling_calibrated_flat_silica
      optics_results_emittance_column: 2
    simulation: *thermal_simulation
    thermal:
      <<: *calibrated_thermal
      reference_curve_column: 2
    data: *paper_data

  - name: cooling_calibrated_silica_cylinders
    run:
      <<: *thermal_run
      results_dir: results/cooling_calibrated_silica_cylinders
      optics_results_emittance_column: 3
    simulation: *thermal_simulation
    thermal:
      <<: *calibrated_thermal
      reference_curve_column: 3
    data: *paper_data
