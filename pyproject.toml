[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radcoolpv"
version = "0.1.0"
description = "YAML-driven radiative-cooling photovoltaics simulator (Python port of radCoolPV)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "openpyxl>=3.0",
]

# NOTE: the RCWA optics stage also needs the S4 Python module (`import S4`),
# which is built once from source (Stanford S4). See README.md. The rest of the
# package (thermal stage, free-form optics, directional/averaging from existing
# OUTPUTS4 files) works without it.

[project.scripts]
radcoolpv = "radcoolpv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radcoolpv*"]

[tool.setuptools.package-data]
"radcoolpv.materials" = ["data/*.csv"]
"radcoolpv" = ["data/*"]
"radcoolpv.validation" = ["data/*.dat", "data/quartzValidations-4-30um/*.txt"]
