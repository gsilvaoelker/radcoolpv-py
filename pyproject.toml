[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radcoolpv"
version = "0.2.0"
description = "Radiative cooling of silicon photovoltaics: spectrum -> temperature -> PV parameters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "openpyxl>=3.0",
]

# Computing a spectrum additionally needs the Stanford S4 module, which has no
# PyPI package and is built from source (see README); it is not listed here.

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "tmm>=0.1.8",        # analytic transfer-matrix reference for tests/test_s4_backend.py
]

[project.scripts]
radcoolpv = "radcoolpv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radcoolpv*"]

[tool.setuptools.package-data]
"radcoolpv.materials" = ["data/*.csv", "data/*.yml", "SOURCES.md"]
"radcoolpv" = ["data/*"]
