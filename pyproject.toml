[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radcoolpv"
version = "0.1.0"
description = "YAML-driven radiative-cooling photovoltaics simulator (Python port of radCoolPV)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "pyyaml>=5.4",
    "openpyxl>=3.0",
]

# The live optics stage additionally needs the Stanford S4 module, which
# has no PyPI package and must be built from source (see README); it is therefore
# not listed here. Thermal calculations and spectrum readers need no S4 build.

[project.scripts]
radcoolpv = "radcoolpv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radcoolpv*"]

[tool.setuptools.package-data]
"radcoolpv.materials" = ["data/*.csv", "data/*.yml", "SOURCES.md"]
"radcoolpv" = ["data/*"]
"radcoolpv.validation" = [
    "data/*.dat",
    "data/quartzValidations-4-30um/*.txt",
    "data/matlab_patterned_ref/*.txt",
]
