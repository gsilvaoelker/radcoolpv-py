# Full run: optics (RCWA via the pure-Python grcwa engine) + thermal energy
# balance, auto-coupled. Mirrors the MATLAB default (a SiO2 cylinder array on a
# Si3N4/Si/Ag stack).
#
# NOTE: a live patterned RCWA sweep at this resolution (2000 wavelengths x 18
# angles) is expensive in pure Python; reduce wavelength.n / use angles: normal
# for a quick check.

run:
  optics: true
  thermal: true
  plots: true
  mode: standard            # standard | cooling_curve | test | spectral_compare
  results_dir: results
  outputs: [legacy, clean]
  optics_results: null

simulation:                 # shared by both stages -> no manual drift
  wavelength: {min: 0.3, max: 30.0, n: 2000}
  angles: hemispherical     # normal | hemispherical (= 18 angles, 0..85 deg)
  rcwa_modes: 100           # grcwa Fourier truncation (nG); patterned layers need ~100+
  grid_nx: 128              # patterned-layer raster resolution
  grid_ny: 128

geometry:
  source: grcwa             # grcwa | freeform
  shape: cylinder           # flat | sphere | semisphere | triangle | cylinder
  photonic_material: sio2
  lattice: {type: square, x: 20.0, y: 20.0}
  discretization_layers: 1
  cylinder: {radius: 5.0, height: 30.0}

structure:                  # ordered flat layers below the photonic structure
  - {material: sio2,      thickness: 100.0}
  - {material: sodalime,  thickness: 0.0}
  - {material: pdms,      thickness: 0.0}
  - {material: nilres,    thickness: 0.0}
  - {material: si3n4,     thickness: 0.075}
  - {material: silicon,   thickness: 250.0}
  - {material: substrate, thickness: 0.0, terminal: true}

materials:                  # logical name -> registry model
  sio2: PalikKitamura_SiO2
  silicon: SiliconNew
  sodalime: Rubin_SodaLime
  si3n4: DrudeSi3N4
  pdms: GuptaQuerry_PDMS
  substrate: Hagemann_Ag
  nilres: Jaramillo_NILresist

thermal:
  ambient_temperature: 298       # K
  convection_coefficient: 12     # W/m2-K
  voltage: {min: 0.1, max: 0.8, n: 100}
  equilibrium: auto              # auto | manual
  pv:
    series_resistance: 0.00011   # Ohm m2
    shunt_resistance: 0.1        # Ohm m2
    bandgap: {eg0: 1.166, alpha: 4.73e-4, beta: 636}
    iqe_file: data/siliconIQE.txt

data:
  solar_spectrum: data/astmg173.xlsx
  atmosphere: data/cptrans_nq_100_15.dat
