# Optics only (RCWA via S4): compute the
# spectral/directional properties of a SiO2 cylinder array on the Si3N4/Si/Ag
# stack. The thermal stage is off, so no energy balance is run.
#
# NOTE: this full compiled S4 sweep is expensive. For a quick optics check,
# reduce simulation.wavelength.n and set simulation.angles: normal.

run:
  optics: true
  thermal: false
  plots: true
  mode: standard
  results_dir: results
  write_outputs: true

simulation:
  wavelength: {min: 0.3, max: 30.0, n: 2000}
  angles: hemispherical
  polarization: unpolarized
  hemisphere_theta_points: 8
  hemisphere_azimuth_points: 12
  s4_modes: 100          # S4 Fourier truncation (NumBasis); patterned layers need ~100+

geometry:
  source: s4                # s4 | freeform
  shape: cylinder
  photonic_material: sio2
  lattice: {type: square, x: 20.0, y: 20.0}
  discretization_layers: 1
  cylinder: {radius: 5.0, height: 30.0}

structure:
  - {material: sio2,      thickness: 100.0}
  - {material: si3n4,     thickness: 0.075}
  - {material: silicon,   thickness: 250.0}
  - {material: substrate, thickness: 0.0, terminal: true}

materials:
  sio2: PalikKitamura_SiO2
  silicon: SiliconNew
  si3n4: DrudeSi3N4
  substrate: Hagemann_Ag

# thermal section unused (run.thermal=false) but kept for completeness.
thermal:
  ambient_temperature: 298
  convection_coefficient: 12

data:
  solar_spectrum: data/astmg173.xlsx
  atmosphere: data/cptrans_nq_100_15.dat
