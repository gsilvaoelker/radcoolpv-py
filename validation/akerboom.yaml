# Akerboom et al., "Passive Radiative Cooling of Silicon Solar Modules with
# Photonic Silica Microcylinders", ACS Photonics 9 (2022) 3831-3840.
# doi:10.1021/acsphotonics.2c01389
#
#   radcoolpv run validation/akerboom.yaml
#
# Twelve cases in three groups. Group B needs no S4 and runs in seconds; groups
# A and C call the solver and are far more expensive.
#
#   A  optics    paper Fig. 3a, calculated normal-incidence emittance     S4
#   B  cooling   paper Fig. 5b, cooling power vs temperature          no S4
#   C  pv        full optical + thermal + electrical result               S4
#
# Each group covers the same three structures: the bare Au/Si module, the same
# module under a flat silica slab, and the silica slab patterned into the
# hexagonal microcylinder array that is the subject of the paper.
#
# The spectra groups A and C compute are committed under data/ so that the
# notebook and the tests reproduce the tables without a solver. To regenerate
# one, run its case and copy optics.txt from the results folder:
#   radcoolpv run validation/akerboom.yaml --case C3_pv_cylinders
#   cp results/C3_pv_cylinders_*/optics.txt validation/data/C3_pv_cylinders.txt

definitions:

  # ---- geometry and materials ------------------------------------------- #
  # Hexagonal array, pitch 6.125 um. radcoolpv builds a hexagonal lattice as a
  # centered-rectangular cell with a second motif at (x/2, y/2), which is
  # hexagonal only when x = y*sqrt(3): 6.125 * sqrt(3) = 10.608811.
  paper_lattice: &paper_lattice
    type: hexagonal
    x: 10.608811
    y: 6.125

  bare: &bare
    shape: flat
    photonic_material: vacuum
    lattice: *paper_lattice

  flat_silica: &flat_silica
    shape: flat
    photonic_material: sio2
    lattice: *paper_lattice

  cylinders: &cylinders
    shape: cylinder
    photonic_material: sio2
    lattice: *paper_lattice
    cylinder: {radius: 1.75, height: 2.25}

  bare_structure: &bare_structure
    - {material: silicon, thickness: 500.0}
    - {material: gold, thickness: 0.08}

  covered_structure: &covered_structure
    - {material: sio2, thickness: 500.0}
    - {material: silicon, thickness: 500.0}
    - {material: gold, thickness: 0.08}

  # Groups A and B reproduce the paper's own cooling-band calculation, which
  # states silicon as nonabsorbing in the infrared (p. 3834).
  cooling_materials: &cooling_materials
    sio2: PalikKitamura_SiO2
    silicon: Akerboom_Si_lossless
    gold: RII_Olmon_2012_ev_Au

  # Group C must generate carriers, so it needs the lossy table. A lossless
  # silicon absorbs no sunlight at all: Jsc integrates to zero and the cell
  # reports a few millivolts.
  pv_materials: &pv_materials
    sio2: PalikKitamura_SiO2
    silicon: Palik_Si
    gold: RII_Olmon_2012_ev_Au

  # ---- group A: calculated optics --------------------------------------- #
  # 2-16 um in steps of exactly 0.05 um, matching the digitized trace.
  normal_s4: &normal_s4
    wavelength: {min: 2.0, max: 16.0, n: 281}
    angles: normal
    polarization: unpolarized
    s4_modes: 60
    substrate: vacuum
    materials: *cooling_materials

  # ---- group B: cooling from the measured spectrum ----------------------- #
  # No geometry, no materials, no solver: the emittance is read from the
  # digitized Fig. 5a trace, so this group isolates the thermal model from any
  # optical-solver error. Runs on a machine with no S4 at all.
  cooling_inputs: &cooling_inputs
    ambient_temperature: 300.0
    absorbed_solar_power: 808.0   # paper eq. 2, not an irradiance

  paper_h: &paper_h
    <<: *cooling_inputs
    # The value stated in the paper's Methods. Kept as its own labelled group
    # so it can be compared with the fitted coefficient below.
    convection_coefficient: 6.0
    temperatures: {min: 260.0, max: 440.0, n: 181}

  fitted_h: &fitted_h
    <<: *cooling_inputs
    # Effective total coefficient from one least-squares fit to all three
    # digitized Figure 5b curves. A calibration: it reproduces the published
    # temperatures by construction, so it is not independent evidence.
    convection_coefficient: 12.54
    temperatures: {min: 260.0, max: 380.0, n: 121}

  # ---- group C: full optical, thermal and electrical result -------------- #
  # The upper limit is set by gold: RII_Olmon_2012_ev_Au is tabulated to
  # 24.93 um and the loader refuses to extrapolate.
  hemispherical_s4: &hemispherical_s4
    wavelength: {min: 0.3, max: 24.9, n: 1000}
    angles: hemispherical
    polarization: unpolarized
    hemisphere_theta_points: 8
    hemisphere_azimuth_points: 1
    s4_modes: 60
    substrate: vacuum
    materials: *pv_materials

  pv_thermal: &pv_thermal
    ambient_temperature: 300.0
    convection_coefficient: 6.0

cases:

  # ===== A. calculated optics, paper Figure 3a ============================ #

  - name: A1_optics_bare
    optics: {<<: *normal_s4, geometry: *bare, structure: *bare_structure}

  - name: A2_optics_flat_silica
    optics: {<<: *normal_s4, geometry: *flat_silica, structure: *covered_structure}

  - name: A3_optics_cylinders
    optics: {<<: *normal_s4, geometry: *cylinders, structure: *covered_structure}

  # ===== B. cooling curve, paper Figure 5b (no S4) ======================== #

  - name: B1_cooling_h6_bare
    optics: {file: data/fig5a_measured_emittance.txt, column: 1}
    thermal: *paper_h

  - name: B2_cooling_h6_flat_silica
    optics: {file: data/fig5a_measured_emittance.txt, column: 2}
    thermal: *paper_h

  - name: B3_cooling_h6_cylinders
    optics: {file: data/fig5a_measured_emittance.txt, column: 3}
    thermal: *paper_h

  - name: B4_cooling_fitted_bare
    optics: {file: data/fig5a_measured_emittance.txt, column: 1}
    thermal: *fitted_h

  - name: B5_cooling_fitted_flat_silica
    optics: {file: data/fig5a_measured_emittance.txt, column: 2}
    thermal: *fitted_h

  - name: B6_cooling_fitted_cylinders
    optics: {file: data/fig5a_measured_emittance.txt, column: 3}
    thermal: *fitted_h

  # ===== C. full optical, thermal and electrical result =================== #

  - name: C1_pv_bare
    optics: {<<: *hemispherical_s4, geometry: *bare, structure: *bare_structure}
    thermal: *pv_thermal
    cell: {}

  - name: C2_pv_flat_silica
    optics: {<<: *hemispherical_s4, geometry: *flat_silica, structure: *covered_structure}
    thermal: *pv_thermal
    cell: {}

  - name: C3_pv_cylinders
    optics: {<<: *hemispherical_s4, geometry: *cylinders, structure: *covered_structure}
    thermal: *pv_thermal
    cell: {}
