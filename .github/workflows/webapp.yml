name: Build and publish the web simulator

on:
  push:
    branches: [main]
    paths:
      - "radcoolpv/**"
      - "webapp/**"
      - "validation/data/C2_pv_flat_silica.txt"
      - "validation/data/C3_pv_cylinders.txt"
      - "validation/data/OE_*.txt"
      - "pyproject.toml"
      - "tests/test_webapp.py"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test the simulator against the pinned C3 case
        run: |
          python -m pip install . pytest
          python -m pytest -q tests/test_webapp.py

      - name: Build the self-contained page
        run: webapp/build.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
